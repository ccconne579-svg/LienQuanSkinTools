# LienQuanSkinTools
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract source
        run: unzip -q LienQuanSkinTools_AndroidStudio.zip -d unpacked

      - name: Build APK
        working-directory: unpacked/LienQuanSkinTools
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LienQuanSkinTools-APK
          path: unpacked/LienQuanSkinTools/app/build/outputs/apk/debug/*.apk
